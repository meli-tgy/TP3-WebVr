<html>
<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script>
      delete AFRAME.components["grabbable"];
    </script>
    <script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft">

      <a-entity light="type: directional; color: #FFF; intensity: 3; castShadow: true" position="-1 3 1"></a-entity>
      <a-entity light="type: ambient; color: #BBB; intensity: 0.6"></a-entity>

      <a-box class="grabbable" grabbable stretchable fall-with-gravity="groundY: 0.2"
             width="0.4" height="0.4" depth="0.4"
             position="0 0.2 -1" rotation="0 45 0" color="#4CC3D9"
             shadow="cast: true; receive: true"></a-box>

      <a-sphere class="grabbable" grabbable stretchable fall-with-gravity="groundY: 0.3"
                position="2 0.3 -3" radius="0.3" color="#EF2D5E"
                shadow="cast: true; receive: true"></a-sphere>

         <a-entity id="gun" class="grabbable" grabbable stretchable
          shootable="speed: 15; gravity: -9.8; projectileRadius: 0.05; color: #FFD700"
          position="-1 1 -1" rotation="0 90 0">
  
        <a-box width="0.08" height="0.08" depth="0.25" color="#333"
         shadow="cast: true"></a-box>
  
        <a-box width="0.04" height="0.04" depth="0.3" color="#555"
         position="0 0.02 -0.25" shadow="cast: true"></a-box>
        </a-entity>
      <a-sky color="#ECECEC"></a-sky>

      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"
               shadow="receive: true"></a-plane>

      <a-entity id="rig">
        <a-entity id="camera" camera position="0 1.6 0" look-controls></a-entity>

        <a-entity id="leftHand"
           oculus-touch-controls="hand: left" super-hands="grabStartButtons: triggerdown; grabEndButtons: triggerup"
           sphere-collider="objects: .grabbable"
           move-controls></a-entity>

        <a-entity id="rightHand"
           oculus-touch-controls="hand: right" super-hands="grabStartButtons: triggerdown; grabEndButtons: triggerup"
           sphere-collider="objects: .grabbable"
           turn-controls></a-entity>
      </a-entity>

    </a-scene>

    <script>
    AFRAME.registerComponent('fall-with-gravity', {
      schema: {
        groundY: { default: 0.2 },
        gravity: { default: -9.8 }
      },
      init: function () {
        this.velocityY = 0;
        this.held = false;
        this.el.addEventListener('grab-start', () => {
          this.held = true;
          this.velocityY = 0;
        });
        this.el.addEventListener('grab-end', () => {
          this.held = false;
        });
      },
      tick: function (time, delta) {
        if (this.held) return;

        const dt = delta / 1000;
        this.velocityY += this.data.gravity * dt;

        const pos = this.el.object3D.position;
        pos.y += this.velocityY * dt;

        if (pos.y <= this.data.groundY) {
          pos.y = this.data.groundY;
          this.velocityY = 0;
        }
      }
    });

    AFRAME.registerComponent('shootable', {
  schema: {
    speed: { default: 15 },
    gravity: { default: -9.8 },
    projectileRadius: { default: 0.05 },
    color: { default: '#FFD700' }
  },
  init: function () {
    this.currentHand = null;
    this.onTriggerDown = this.onTriggerDown.bind(this);
    this.el.addEventListener('grab-start', (evt) => {
      this.currentHand = evt.detail && evt.detail.hand;
      if (this.currentHand) {
        this.currentHand.addEventListener('triggerdown', this.onTriggerDown);
      }
    });

    
    this.el.addEventListener('grab-end', () => {
      if (this.currentHand) {
        this.currentHand.removeEventListener('triggerdown', this.onTriggerDown);
      }
      this.currentHand = null;
    });
  },
  onTriggerDown: function () {
    this.shoot();
  },
  shoot: function () {
    const gunObj = this.el.object3D;

    const muzzleWorld = new THREE.Vector3(0, 0.02, -0.4);
    gunObj.localToWorld(muzzleWorld);

    const worldQuat = new THREE.Quaternion();
    gunObj.getWorldQuaternion(worldQuat);
    const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(worldQuat).normalize();

    const projectile = document.createElement('a-sphere');
    projectile.setAttribute('radius', this.data.projectileRadius);
    projectile.setAttribute('color', this.data.color);
    projectile.setAttribute('shadow', 'cast: true');
    projectile.setAttribute('position', `${muzzleWorld.x} ${muzzleWorld.y} ${muzzleWorld.z}`);
    projectile.setAttribute('projectile-motion',
      `speed: ${this.data.speed}; gravity: ${this.data.gravity}; dirX: ${direction.x}; dirY: ${direction.y}; dirZ: ${direction.z}`);

    this.el.sceneEl.appendChild(projectile);

    setTimeout(() => {
      if (projectile.parentNode) projectile.parentNode.removeChild(projectile);
    }, 5000);
  }
});

AFRAME.registerComponent('projectile-motion', {
  schema: {
    speed: { default: 15 },
    gravity: { default: -9.8 },
    dirX: { default: 0 },
    dirY: { default: 0 },
    dirZ: { default: -1 }
  },
  init: function () {
    this.velocity = new THREE.Vector3(this.data.dirX, this.data.dirY, this.data.dirZ)
      .normalize()
      .multiplyScalar(this.data.speed);
  },
  tick: function (time, delta) {
    const dt = delta / 1000;
    this.velocity.y += this.data.gravity * dt;

    const pos = this.el.object3D.position;
    pos.x += this.velocity.x * dt;
    pos.y += this.velocity.y * dt;
    pos.z += this.velocity.z * dt;

    if (pos.y <= 0) {
      if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
    }
  }
});

    AFRAME.registerComponent('turn-controls', {
      schema: { speed: {default: 60} },
      init: function () {
        this.rig = this.el.closest('[movement-controls]') || this.el.parentEl;
        this.turnX = 0;
        this.el.addEventListener('axismove', (evt) => {
          const x = evt.detail.axis[2] !== undefined ? evt.detail.axis[2] : evt.detail.axis[0];
          this.turnX = x;
        });
      },
      tick: function (time, delta) {
        if (!this.turnX || Math.abs(this.turnX) < 0.15) return;
        const rig = this.rig;
        const rotation = rig.getAttribute('rotation');
        rotation.y -= this.turnX * this.data.speed * (delta / 1000);
        rig.setAttribute('rotation', rotation);
      }
    });

    AFRAME.registerComponent('move-controls', {
      schema: { speed: { default: 2 } },
      init: function () {
        this.rig = this.el.closest('#rig') || document.querySelector('#rig');
        this.camera = document.querySelector('#camera');
        this.axisX = 0;
        this.axisY = 0;
        this.el.addEventListener('axismove', (evt) => {
          this.axisX = evt.detail.axis[2] !== undefined ? evt.detail.axis[2] : evt.detail.axis[0];
          this.axisY = evt.detail.axis[3] !== undefined ? evt.detail.axis[3] : evt.detail.axis[1];
        });
      },
      tick: function (time, delta) {
        if (Math.abs(this.axisX) < 0.15 && Math.abs(this.axisY) < 0.15) return;

        const dt = delta / 1000;
        const camRotation = this.camera.object3D.rotation;

        const forward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, camRotation.y, 0));
        const right = new THREE.Vector3(1, 0, 0).applyEuler(new THREE.Euler(0, camRotation.y, 0));

        const move = new THREE.Vector3();
        move.addScaledVector(forward, -this.axisY * this.data.speed * dt);
        move.addScaledVector(right, this.axisX * this.data.speed * dt);

        const pos = this.rig.object3D.position;
        pos.x += move.x;
        pos.z += move.z;
      }
    });
    </script>
  </body>
</html>
