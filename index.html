<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.8.0/dist/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.0/dist/super-hands.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft" physics="debug: false; gravity: -9.81">

      <a-entity light="type: directional; color: #FFF; intensity: 3; castShadow: true" position="-1 3 1"></a-entity>
      <a-entity light="type: ambient; color: #BBB; intensity: 0.6"></a-entity>

      <a-box class="grabbable" width="0.3" height="0.3" depth="0.3" position="0 0.15 -1" rotation="0 45 0" color="#4CC3D9" shadow="cast: true; receive: true"
        dynamic-body="shape: box; mass: 1" grabbable grab-physics-toggle></a-box>

      <a-sphere class="grabbable" position="2 0.15 -3" radius="0.15" color="#EF2D5E" shadow="cast: true; receive: true"
        dynamic-body="shape: sphere; mass: 1" grabbable grab-physics-toggle></a-sphere>

      <a-sky color="#ECECEC"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4" shadow="receive: true" static-body></a-plane>

      <a-entity id="rig">
        <a-entity id="camera" camera position="0 1.6 0" look-controls></a-entity>
        <a-entity id="leftHand" oculus-touch-controls="hand: left" move-controls></a-entity>
        <a-entity id="rightHand" oculus-touch-controls="hand: right" turn-controls
          super-hands="grabStartButtons: triggerdown; grabEndButtons: triggerup"
          sphere-collider="objects: .grabbable; radius: 0.15"
          debug-buttons></a-entity>
      </a-entity>

    </a-scene>

    <script>
    AFRAME.registerComponent('turn-controls', {
      schema: { speed: { default: 60 } },
      init: function () {
        this.rig = document.querySelector('#rig');
        this.turnX = 0;
        this.el.addEventListener('axismove', (evt) => {
          const x = evt.detail.axis[2] !== undefined ? evt.detail.axis[2] : evt.detail.axis[0];
          this.turnX = x;
        });
      },
      tick: function (time, delta) {
        if (!this.turnX || Math.abs(this.turnX) < 0.15) return;
        const rig = this.rig;
        const rotation = rig.getAttribute('rotation');
        rotation.y -= this.turnX * this.data.speed * (delta / 1000);
        rig.setAttribute('rotation', rotation);
      }
    });

    AFRAME.registerComponent('move-controls', {
      schema: { speed: { default: 2 } }, // m/s
      init: function () {
        this.rig = document.querySelector('#rig');
        this.camera = document.querySelector('#camera');
        this.axisX = 0;
        this.axisY = 0;
        this.el.addEventListener('axismove', (evt) => {
          this.axisX = evt.detail.axis[2] !== undefined ? evt.detail.axis[2] : evt.detail.axis[0];
          this.axisY = evt.detail.axis[3] !== undefined ? evt.detail.axis[3] : evt.detail.axis[1];
        });
      },
      tick: function (time, delta) {
        if (Math.abs(this.axisX) < 0.15 && Math.abs(this.axisY) < 0.15) return; 

        const dt = delta / 1000;
        const camRotation = this.camera.object3D.rotation;

        const forward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, camRotation.y, 0));
        const right = new THREE.Vector3(1, 0, 0).applyEuler(new THREE.Euler(0, camRotation.y, 0));

        const move = new THREE.Vector3();
        move.addScaledVector(forward, -this.axisY * this.data.speed * dt);
        move.addScaledVector(right, this.axisX * this.data.speed * dt);

        const pos = this.rig.object3D.position;
        pos.x += move.x;
        pos.z += move.z;
      }
    });

    AFRAME.registerComponent('debug-buttons', {
      init: function () {
        const events = ['triggerdown', 'triggerup', 'gripdown', 'gripup',
          'thumbstickdown', 'thumbstickup', 'abuttondown', 'bbuttondown'];
        events.forEach((evt) => {
          this.el.addEventListener(evt, () => console.log('rightHand event:', evt));
        });
      }
    });

    AFRAME.registerComponent('grab-physics-toggle', {
      init: function () {
        this.el.addEventListener('grab-start', () => {
          this.el.setAttribute('dynamic-body', 'type', 'kinematic');
        });
        this.el.addEventListener('grab-end', () => {
          this.el.setAttribute('dynamic-body', 'type', 'dynamic');
        });
      }
    });
    </script>
  </body>
</html>
